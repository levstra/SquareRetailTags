<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESL Pricing</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Resolve the theme before first paint, so a dark-mode user never sees a
      white flash. This duplicates a few lines of src/theme.ts on purpose:
      module JS runs too late to prevent the flash. Keep the storage key and
      the resolution order here in step with that file.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("esl.theme");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            saved === "light" || saved === "dark" ? saved : dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
