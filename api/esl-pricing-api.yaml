openapi: "3.1.0"

info:
  title: ESL Pricing API
  version: "0.1.0"
  description: >
    Dashboard API of the ESL Pricing Service. Every operation requires a
    Cognito access token (`Authorization: Bearer`) unless it declares
    `security: []`. The Pi gateway's contract is separate
    (WestgateLabels/docs/CENTRAL-API-CONTRACT.md) and arrives in step 4.

servers:
  - url: /v1

security:
  - cognitoBearer: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /catalog/variations:
    get:
      operationId: listVariations
      summary: List all catalog variations for tag assignment
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: All known variations with parent item name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariationList"

  /tags:
    get:
      operationId: listTags
      summary: List all tags with their desired display state
      description: >
        Tags in the stores the signed-in user may use (every store for owners
        and all-stores staff). A staff member with no store access gets an
        empty list. The gateway polls this endpoint to discover which tags
        need updating. The gateway compares content_hash against what
        it last rendered; if different, it fetches and pushes the new content.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"

  /tags/{tag_id}:
    parameters:
      - name: tag_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TagId"
    get:
      operationId: getTag
      summary: Get desired display state for a single tag
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Tag desired state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: assignTag
      summary: Create or update a tag's variation assignment
      description: >
        Creates the tag if it does not exist. Pass variation_id to assign a
        catalog variation; pass null to unassign. content_hash is recomputed
        immediately so the gateway picks up the change on its next poll.
        A staff member with no store access gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignBody"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Tag after assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          description: variation_id not found in catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The tag can't be used by this business (for example, it is
            registered elsewhere). Deliberately does not say why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tags/{tag_id}/confirm:
    parameters:
      - name: tag_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TagId"
    post:
      operationId: confirmTag
      summary: Gateway reports what it successfully rendered
      description: >
        Called by the gateway after it has pushed content to the physical tag.
        The service records the confirmation timestamp and battery level.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmBody"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "204":
          description: Confirmation recorded
        "404":
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me:
    get:
      operationId: getMe
      summary: The signed-in user, their business and the stores they may use
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /stores:
    get:
      operationId: listStores
      summary: Stores the signed-in user may use (empty for staff with no store access)
      responses:
        "200":
          description: Stores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /stores/selection:
    put:
      operationId: selectStores
      summary: Use these Square locations as stores (owners only; additive)
      description: >
        Creates, links and renames stores for the chosen locations. Never
        deletes a store. A store with no Square location is linked to the
        first chosen location that has no store yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSelection"
      responses:
        "200":
          description: All stores after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreList"
        "400":
          description: Empty selection or a location that isn't an active Square location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Square is not connected, or Square rejected the token (reconnect needed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/SquareUnavailable"

  /staff:
    get:
      operationId: listStaff
      summary: Everyone with access to this business (owners only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: inviteStaff
      summary: Invite a staff member by email (owners only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInvite"
      responses:
        "201":
          description: Invited; Cognito emails them a temporary password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "400":
          description: A store id does not belong to this business, or all_stores was combined with store_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This email can't be invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The invitation could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /staff/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateStaff
      summary: Change a staff member's stores or disable/enable them (owners only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "400":
          description: A store id does not belong to this business, or all_stores was combined with store_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user in this business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The identity provider call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /square/connection:
    get:
      operationId: getSquareConnection
      summary: This business's Square connection status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquareConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /square/oauth/start:
    post:
      operationId: startSquareOAuth
      summary: Begin connecting this business's Square account (owners only)
      description: >
        Also sets the esl_square_oauth_state cookie (HttpOnly, SameSite=Lax,
        Path=/v1/square/oauth/callback, 10 minutes, Secure over https). The
        callback accepts the state only from the browser holding that cookie.
      responses:
        "200":
          description: Send the browser to authorize_url
          headers:
            Set-Cookie:
              description: >
                esl_square_oauth_state=<state>; HttpOnly; SameSite=Lax;
                Path=/v1/square/oauth/callback; Max-Age=600 (plus Secure over https)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Square OAuth is not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /square/oauth/callback:
    get:
      operationId: squareOAuthCallback
      summary: Square redirects here after the owner approves or declines
      description: >
        Public. The business comes from the single-use state, never from the
        query. The state must match the esl_square_oauth_state cookie set by
        startSquareOAuth, or it is not consumed and the code is not exchanged.
        Always redirects to /settings/square?result=<result> and clears the
        cookie.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: esl_square_oauth_state
          in: cookie
          required: false
          description: The state set by startSquareOAuth in this browser.
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirect to the dashboard. result is one of connected, error,
            merchant_in_use, different_merchant.

  /square/locations:
    get:
      operationId: listSquareLocations
      summary: Active Square locations and the store each is linked to (owners only)
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquareLocationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Square is not connected, or Square rejected the token (reconnect needed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/SquareUnavailable"

components:
  securitySchemes:
    cognitoBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token for the dashboard app client.

  responses:
    Unauthorized:
      description: Not signed in, or the token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Signed in, but this user may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    SquareUnavailable:
      description: Square returned an error other than an invalid token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    TagId:
      type: string
      pattern: "^[0-9A-F]{16}$"
      description: 16-character uppercase hex tag identifier

    Tag:
      type: object
      required:
        - id
        - content_hash
      properties:
        id:
          $ref: "#/components/schemas/TagId"
        variation_id:
          type: string
          nullable: true
          description: Square catalog variation ID this tag is assigned to
        name:
          type: string
          nullable: true
          description: Product name from the Square catalog
        variation_name:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        price:
          type: integer
          nullable: true
          description: Price in smallest currency unit (e.g. cents). Null when VARIABLE_PRICING.
        pricing_type:
          type: string
          nullable: true
          enum: [FIXED_PRICING, VARIABLE_PRICING]
        content_hash:
          type: string
          nullable: true
          description: >
            SHA-256 of the canonical projection. The gateway uses this to detect
            drift without re-fetching every tag's full content on every poll.
        last_pushed_at:
          type: string
          format: date-time
          nullable: true
        last_confirmed_at:
          type: string
          format: date-time
          nullable: true
        battery_pct:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100

    TagList:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    Variation:
      type: object
      required:
        - id
        - item_id
        - name
        - variation_name
        - pricing_type
      properties:
        id:
          type: string
        item_id:
          type: string
        name:
          type: string
          description: Parent item name
        variation_name:
          type: string
        sku:
          type: string
          nullable: true
        price:
          type: integer
          nullable: true
          description: Price in cents. Null when VARIABLE_PRICING.
        pricing_type:
          type: string
          enum: [FIXED_PRICING, VARIABLE_PRICING]

    VariationList:
      type: object
      required:
        - variations
      properties:
        variations:
          type: array
          items:
            $ref: "#/components/schemas/Variation"

    AssignBody:
      type: object
      properties:
        variation_id:
          type: string
          nullable: true
          description: Variation to assign. Null to unassign.

    ConfirmBody:
      type: object
      required:
        - content_hash
      properties:
        content_hash:
          type: string
          description: Hash of what was actually rendered, for drift detection
        battery_pct:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100

    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    Store:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    SquareLocation:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        store_id:
          type: string
          format: uuid
          nullable: true

    SquareLocationList:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/SquareLocation"

    StoreSelection:
      type: object
      required: [location_ids]
      properties:
        location_ids:
          type: array
          minItems: 1
          items:
            type: string

    StoreList:
      type: object
      required: [stores]
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/Store"

    Me:
      type: object
      required: [user_id, email, role, business, stores]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [owner, staff]
        business:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        stores:
          type: array
          items:
            $ref: "#/components/schemas/Store"

    StaffUser:
      type: object
      required: [id, email, role, disabled, all_stores, store_ids]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [owner, staff]
        disabled:
          type: boolean
        all_stores:
          type: boolean
          description: >
            Staff only. True means every store in the business, including
            stores added later, and store_ids is then empty. Always false for
            owners, who use every store regardless.
        store_ids:
          type: array
          description: >
            The stores a staff member may use when all_stores is false. Empty
            with all_stores false means no store access.
          items:
            type: string
            format: uuid

    StaffList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/StaffUser"

    StaffInvite:
      type: object
      required: [email]
      properties:
        email:
          type: string
        all_stores:
          type: boolean
          description: >
            Every store, including stores added later. Omitted means false.
            Can't be combined with a non-empty store_ids.
        store_ids:
          type: array
          description: >
            The stores the new staff member may use. Omitted or empty with
            all_stores false means no store access until an owner grants one.
          items:
            type: string
            format: uuid

    StaffUpdate:
      type: object
      description: >
        Sending all_stores or store_ids replaces the staff member's store
        access. A field left out counts as false or empty, so
        {"all_stores": false} alone leaves them with no store access.
        all_stores true with a non-empty store_ids is a 400.
      properties:
        all_stores:
          type: boolean
        store_ids:
          type: array
          description: Replaces allowed stores. Empty with all_stores false means no store access.
          items:
            type: string
            format: uuid
        disabled:
          type: boolean

    SquareConnection:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_connected, active, needs_reconnect, revoked]
        merchant_id:
          type: string
          nullable: true

    AuthorizeUrl:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string
