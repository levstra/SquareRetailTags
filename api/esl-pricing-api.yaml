openapi: "3.1.0"

info:
  title: ESL Pricing API
  version: "0.1.0"
  description: >
    Dashboard API of the ESL Pricing Service. Every operation requires a
    Cognito access token (`Authorization: Bearer`) unless it declares
    `security: []`. The three operations tagged `gateway` are called only by
    the store Pi, live under `/api` (not `/v1`) and use the per-store
    `X-Api-Key` instead; they are copied from the Pi's contract
    (WestgateLabels/docs/central-api.openapi.yaml).

servers:
  - url: /v1

security:
  - cognitoBearer: []

tags:
  - name: gateway
    description: Called only by the store Pi. Copied unchanged from WestgateLabels/docs/central-api.openapi.yaml; change both repos together.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /catalog/variations:
    get:
      operationId: listVariations
      summary: List all catalog variations for tag assignment
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: All known variations with parent item name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariationList"

  /tags:
    get:
      operationId: listTags
      summary: List all tags with their desired display state
      description: >
        Tags in the stores the signed-in user may use (every store for owners
        and all-stores staff). A staff member with no store access gets an
        empty list. This is the dashboard's view; the Pi gateway does not use it
        (see the Pi contract).
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"

  /tags/{tag_id}:
    parameters:
      - name: tag_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TagId"
    get:
      operationId: getTag
      summary: Get desired display state for a single tag
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Tag desired state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The tag ID is not 12 hexadecimal characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: assignTag
      summary: Create or update a tag's variation assignment
      description: >
        Creates the tag if it does not exist. Pass variation_id to assign a
        catalog variation; pass null to unassign. content_hash is recomputed
        immediately; the gateway receives the change as a command.
        A staff member with no store access gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignBody"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Tag after assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          description: variation_id not found in catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The tag ID is not 12 hexadecimal characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The tag can't be used by this business, or the variation has no
            price to show at this store (VARIABLE_PRICING). The detail says
            which; it never reveals who owns a tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me:
    get:
      operationId: getMe
      summary: The signed-in user, their business and the stores they may use
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /stores:
    get:
      operationId: listStores
      summary: Stores the signed-in user may use (empty for staff with no store access)
      responses:
        "200":
          description: Stores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /stores/selection:
    put:
      operationId: selectStores
      summary: Use these Square locations as stores (owners only; additive)
      description: >
        Creates, links and renames stores for the chosen locations. Never
        deletes a store. A store with no Square location is linked to the
        first chosen location that has no store yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSelection"
      responses:
        "200":
          description: All stores after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreList"
        "400":
          description: Empty selection or a location that isn't an active Square location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Square is not connected, or Square rejected the token (reconnect needed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/SquareUnavailable"

  /staff:
    get:
      operationId: listStaff
      summary: Everyone with access to this business (owners only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: inviteStaff
      summary: Invite a staff member by email (owners only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInvite"
      responses:
        "201":
          description: Invited; Cognito emails them a temporary password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "400":
          description: A store id does not belong to this business, or all_stores was combined with store_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This email can't be invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The invitation could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /staff/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateStaff
      summary: Change a staff member's stores or disable/enable them (owners only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "400":
          description: A store id does not belong to this business, or all_stores was combined with store_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user in this business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The identity provider call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /square/connection:
    get:
      operationId: getSquareConnection
      summary: This business's Square connection status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquareConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /square/oauth/start:
    post:
      operationId: startSquareOAuth
      summary: Begin connecting this business's Square account (owners only)
      description: >
        Also sets the esl_square_oauth_state cookie (HttpOnly, SameSite=Lax,
        Path=/v1/square/oauth/callback, 10 minutes, Secure over https). The
        callback accepts the state only from the browser holding that cookie.
      responses:
        "200":
          description: Send the browser to authorize_url
          headers:
            Set-Cookie:
              description: >
                esl_square_oauth_state=<state>; HttpOnly; SameSite=Lax;
                Path=/v1/square/oauth/callback; Max-Age=600 (plus Secure over https)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Square OAuth is not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /square/oauth/callback:
    get:
      operationId: squareOAuthCallback
      summary: Square redirects here after the owner approves or declines
      description: >
        Public. The business comes from the single-use state, never from the
        query. The state must match the esl_square_oauth_state cookie set by
        startSquareOAuth, or it is not consumed and the code is not exchanged.
        Always redirects to /settings/square?result=<result> and clears the
        cookie.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: esl_square_oauth_state
          in: cookie
          required: false
          description: The state set by startSquareOAuth in this browser.
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirect to the dashboard. result is one of connected, error,
            merchant_in_use, different_merchant.

  /square/locations:
    get:
      operationId: listSquareLocations
      summary: Active Square locations and the store each is linked to (owners only)
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquareLocationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Square is not connected, or Square rejected the token (reconnect needed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/SquareUnavailable"

  /api/label-updates/pending:
    servers:
      - url: /
    get:
      tags: [gateway]
      security:
        - gatewayKey: []
      operationId: fetchPending
      summary: Commands for a store whose central status is Pending, oldest first
      parameters:
        - name: storeId
          in: query
          required: true
          schema: { type: string, example: STORE-001 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: wait
          in: query
          description: |
            Long polling. Hold the request until at least one Pending command exists for the store, then answer at
            once; answer an empty page at the deadline. The Pi sends 25. A server that ignores this parameter still
            works: the Pi falls back to polling every 5 s.
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
      responses:
        '200':
          description: "A page of commands. The Pi drains further pages when hasMore is true, allowing Accepted reports to settle between pages (default 1 s). Return an empty updates array and hasMore false when no work exists."
          content:
            application/json:
              schema:
                type: object
                required: [updates, hasMore]
                properties:
                  updates:
                    type: array
                    items: { $ref: '#/components/schemas/LabelUpdateCommand' }
                  hasMore: { type: boolean }
        '401':
          description: Missing, unknown or revoked X-Api-Key.
        '403':
          description: The key does not match the store.

  /api/label-updates/status:
    servers:
      - url: /
    post:
      tags: [gateway]
      security:
        - gatewayKey: []
      operationId: reportStatus
      summary: Batch of status reports from the Pi
      description: |
        Validate the entire batch before applying it; reject malformed reports or commands belonging to
        another store without partially applying the batch. Count every valid submitted entry, including
        duplicates and stale reports, in acceptedCount. Apply state only when statusAt is newer; a terminal
        command must not regress to Dispatched when a delayed Accepted report arrives.
        Reports are flushed on a signal or every 2 s, in batches of 100 by default (configurable up to 1000).
        The durable outbox retains the entire batch on network errors, non-2xx responses, empty/malformed
        acknowledgements or an acceptedCount different from the submitted count, including a larger count.
        Retries back off from 5 s to at most 60 s. A lost response after commit causes the whole batch to repeat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId, reports]
              properties:
                storeId: { type: string }
                reports:
                  type: array
                  items: { $ref: '#/components/schemas/LabelUpdateStatusReport' }
      responses:
        '200':
          description: All reports acknowledged, including valid duplicates and stale entries. acceptedCount must equal the submitted batch size. Non-2xx, malformed or mismatched acknowledgements retain the whole batch for retry.
          content:
            application/json:
              schema:
                type: object
                required: [acceptedCount]
                properties:
                  acceptedCount: { type: integer, minimum: 0 }
        '401':
          description: Missing, unknown or revoked X-Api-Key.
        '403':
          description: The key does not match the store.
        '400':
          description: Malformed or foreign command report; the entire batch is rejected without partial application.

  /api/labels/telemetry:
    servers:
      - url: /
    post:
      tags: [gateway]
      security:
        - gatewayKey: []
      operationId: reportTelemetry
      summary: Label and access point telemetry snapshot from the Pi (contract 9.2)
      description: |
        Sent every 60 s with the labels whose state changed, every 15 min with every label (`full: true`), and
        early (at most every 5 s) when an access point connects or disconnects or a label's low-battery flag flips.
        The first report after a Pi restart is full.
        These are default configurable intervals. Even with no changed labels, the routine report contains
        an empty labels array and current access point state, providing a liveness signal.
        Failed posts do not advance the last successful report time or change cursor; subsequent snapshots
        include the union of pending changes. Telemetry is not a durable event outbox.
        Upsert labels per (storeId, tagId) when lastSeenAt is newer than the stored value (or the stored value
        is null). A full snapshot is not a deletion list: retain labels absent from it and their last-seen times.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetryReport' }
      responses:
        '200':
          description: Accepted. Unlike status reports, telemetry accepts any successful 2xx response, including an empty body; acceptedCount is informational.
          content:
            application/json:
              schema:
                type: object
                properties:
                  acceptedCount: { type: integer, minimum: 0 }
        '204':
          description: Telemetry accepted without a response body.
        '401':
          description: Missing, unknown or revoked X-Api-Key.
        '403':
          description: The key does not match the store.

components:
  securitySchemes:
    cognitoBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token for the dashboard app client.
    gatewayKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Per-store key issued by `esl admin add-gateway` (the Pi's `CentralApi:ApiKey`).

  responses:
    Unauthorized:
      description: Not signed in, or the token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Signed in, but this user may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    SquareUnavailable:
      description: Square returned an error other than an invalid token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    TagId:
      type: string
      pattern: "^[0-9A-F]{12}$"
      description: 12-character uppercase hex tag identifier (the Pi's and the hardware's format)

    Tag:
      type: object
      required:
        - id
        - content_hash
      properties:
        id:
          $ref: "#/components/schemas/TagId"
        variation_id:
          type: string
          nullable: true
          description: Square catalog variation ID this tag is assigned to
        name:
          type: string
          nullable: true
          description: Product name from the Square catalog
        variation_name:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        price:
          type: integer
          nullable: true
          description: Price in smallest currency unit (e.g. cents). Null when VARIABLE_PRICING.
        pricing_type:
          type: string
          nullable: true
          enum: [FIXED_PRICING, VARIABLE_PRICING]
        content_hash:
          type: string
          nullable: true
          description: >
            SHA-256 of the canonical projection. Used by this service to detect
            changes; it is never sent to the gateway.
        last_confirmed_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          description: Last display version issued for this tag (0 = never sent).
        store_id:
          type: string
          format: uuid

    TagList:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    Variation:
      type: object
      required:
        - id
        - item_id
        - name
        - variation_name
        - pricing_type
      properties:
        id:
          type: string
        item_id:
          type: string
        name:
          type: string
          description: Parent item name
        variation_name:
          type: string
        sku:
          type: string
          nullable: true
        price:
          type: integer
          nullable: true
          description: Price in cents. Null when VARIABLE_PRICING.
        pricing_type:
          type: string
          enum: [FIXED_PRICING, VARIABLE_PRICING]

    VariationList:
      type: object
      required:
        - variations
      properties:
        variations:
          type: array
          items:
            $ref: "#/components/schemas/Variation"

    AssignBody:
      type: object
      properties:
        variation_id:
          type: string
          nullable: true
          description: Variation to assign. Null to unassign.

    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    Store:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    SquareLocation:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        store_id:
          type: string
          format: uuid
          nullable: true

    SquareLocationList:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/SquareLocation"

    StoreSelection:
      type: object
      required: [location_ids]
      properties:
        location_ids:
          type: array
          minItems: 1
          items:
            type: string

    StoreList:
      type: object
      required: [stores]
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/Store"

    Me:
      type: object
      required: [user_id, email, role, business, stores]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [owner, staff]
        business:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        stores:
          type: array
          items:
            $ref: "#/components/schemas/Store"

    StaffUser:
      type: object
      required: [id, email, role, disabled, all_stores, store_ids]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [owner, staff]
        disabled:
          type: boolean
        all_stores:
          type: boolean
          description: >
            Staff only. True means every store in the business, including
            stores added later, and store_ids is then empty. Always false for
            owners, who use every store regardless.
        store_ids:
          type: array
          description: >
            The stores a staff member may use when all_stores is false. Empty
            with all_stores false means no store access.
          items:
            type: string
            format: uuid

    StaffList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/StaffUser"

    StaffInvite:
      type: object
      required: [email]
      properties:
        email:
          type: string
        all_stores:
          type: boolean
          description: >
            Every store, including stores added later. Omitted means false.
            Can't be combined with a non-empty store_ids.
        store_ids:
          type: array
          description: >
            The stores the new staff member may use. Omitted or empty with
            all_stores false means no store access until an owner grants one.
          items:
            type: string
            format: uuid

    StaffUpdate:
      type: object
      description: >
        Sending all_stores or store_ids replaces the staff member's store
        access. A field left out counts as false or empty, so
        {"all_stores": false} alone leaves them with no store access.
        all_stores true with a non-empty store_ids is a 400.
      properties:
        all_stores:
          type: boolean
        store_ids:
          type: array
          description: Replaces allowed stores. Empty with all_stores false means no store access.
          items:
            type: string
            format: uuid
        disabled:
          type: boolean

    SquareConnection:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_connected, active, needs_reconnect, revoked]
        merchant_id:
          type: string
          nullable: true

    AuthorizeUrl:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, description: 'Nonnegative decimal amount encoded as a string, not a JSON number.', example: "219.99" }
        currency: { type: string, minLength: 3, maxLength: 3, description: ISO 4217 currency code., example: USD }

    Display:
      type: object
      description: Semantic data aligned with the Square catalog model; the Pi owns the layout.
      required: [itemName, price]
      properties:
        itemName: { type: string, minLength: 1, description: Square item name; must contain non-whitespace text. }
        variationName: { type: [string, 'null'], description: 'Square variation name as-is. Not rendered when empty, Regular (case-insensitive), or equal to itemName.' }
        price: { $ref: '#/components/schemas/Money' }
        sku: { type: [string, 'null'] }
        category: { type: [string, 'null'], description: Only if the integration already has it; stored, not rendered. }
        description: { type: [string, 'null'], description: Only if the integration already has it; stored, not rendered. }

    LabelUpdateCommand:
      type: object
      description: |
        Central sends semantic display data; the Pi renders images and barcodes. Update and Unassign share
        a strictly increasing per-label version ladder. A version at or below the highest successfully applied
        version is Superseded. Newer queued display work can supersede older queued work; claimed/in-flight
        work completes before another command is sent to that label.
        Locate ignores version and does not change or participate in the display version ladder. It waits
        behind in-flight work for the same label; a newer Locate replaces an older queued Locate.
        Schemas describe canonical commands central should emit. The Pi tolerates missing createdAt
        (uses receipt time) and productId, and treats a blank/null action as Update. Invalid commands with
        a parseable updateId are reported as Failed/InvalidCommand when they can be deserialized;
        a missing or unparseable updateId cannot be correlated and is skipped.
      required: [updateId, storeId, tagId, createdAt]
      allOf:
        - if:
            properties:
              action: { const: Locate }
            required: [action]
          then: {}
          else:
            required: [version]
            properties:
              version: { type: integer, format: int64 }
        - if:
            properties:
              action: { const: Update }
          then:
            required: [productId, display]
            properties:
              productId: { type: string, minLength: 1 }
              display: { $ref: '#/components/schemas/Display' }
      properties:
        updateId: { type: string, format: uuid, description: Idempotency key; never reused for different content. }
        storeId: { type: string, description: Must equal the Pi's configured store; anything else is rejected as `InvalidCommand`. }
        tagId: { type: string, pattern: '^[0-9A-Fa-f]{12}$', description: The physical label. }
        action:
          type: string
          enum: [Update, Unassign, Locate]
          default: Update
          description: "`Update` paints the product template; `Unassign` paints the barcode screen; `Locate` flashes the LED."
        version:
          type: [integer, 'null']
          format: int64
          description: Strictly increasing per tagId; required for Update and Unassign, ignored for Locate.
        productId: { type: [string, 'null'], description: Square catalog object id of the variation, for logs and reports. }
        createdAt: { type: string, format: date-time }
        display:
          oneOf:
            - $ref: '#/components/schemas/Display'
            - type: 'null'
          description: Required for Update; omitted or null for Unassign and Locate (ignored by the Pi).
        seconds:
          type: [integer, 'null']
          minimum: 1
          maximum: 65535
          description: Locate only. Flash duration in seconds; Pi default 30, capped at its configured maximum (default 300). Does not change the displayed image.
      examples:
        - updateId: 7f0d0d5c-0b7e-4d2a-9c1e-1f3b6a4d8e21
          storeId: STORE-001
          tagId: 840001282A7E
          version: 42
          productId: SQ-VARIATION-8H2K
          createdAt: '2026-09-05T14:03:00Z'
          display:
            itemName: 2024 Topps Chrome Baseball
            variationName: Hobby Box
            price: { amount: "219.99", currency: USD }
            sku: TC24-HBY
        - updateId: 0d7f4c3e-5f1a-4c8b-9b7e-2a6d8e1f3c44
          storeId: STORE-001
          tagId: 840001282A7E
          version: 44
          createdAt: '2026-09-06T09:00:00Z'
          action: Unassign
        - updateId: 3c1f6a2e-7d0b-4e9a-8b1c-5f2d9e7a1b44
          storeId: STORE-001
          tagId: 840001282A7E
          action: Locate
          seconds: 30
          createdAt: '2026-09-06T14:03:00Z'

    Diagnostics:
      type: object
      required: [rfPower, battery, temperature, statusByte, lowBattery]
      properties:
        rfPower: { type: integer, description: dBm; -256 means the label did not answer. }
        battery: { type: integer, description: 'Raw vendor battery byte; unit is unconfirmed (likely tenths of a volt). Not a percentage; 0 means no data.' }
        temperature: { type: integer }
        statusByte: { type: integer }
        lowBattery: { type: boolean }

    LabelUpdateStatusReport:
      type: object
      required: [updateId, tagId, action, status, statusAt, attempt]
      properties:
        updateId: { type: string, format: uuid }
        tagId: { type: string }
        version: { type: [integer, 'null'], format: int64, description: null for Locate. }
        action: { type: string, enum: [Update, Unassign, Locate] }
        status:
          type: string
          enum: [Accepted, Succeeded, Failed, Superseded]
          description: |
            Only Accepted and terminal states cross the wire. Accepted means durably stored, not delivered;
            Queued, Dispatching and SentToAp are local states mapped to Accepted on duplicate reports.
            Succeeded confirms the display update for Update/Unassign, or the LED command for Locate.
            Failed and Superseded are terminal; Superseded is not an error. Immediate terminal outcomes
            may arrive without an earlier Accepted report.
        statusAt: { type: string, format: date-time }
        attempt: { type: integer, minimum: 0, description: Attempt counter; may be zero before hardware execution. }
        apId: { type: [string, 'null'] }
        failureCode:
          type: [string, 'null']
          enum: [LabelNoResponse, ApUnavailable, ApTimeout, ApQueueFull, LabelRejectedKey, LabelHardwareError, RenderError, InvalidCommand, InternalError, null]
        failureMessage: { type: [string, 'null'], description: Failure details or supersession reason; null otherwise. }
        retryable:
          type: [boolean, 'null']
          description: |
            Null for non-failures. True for LabelNoResponse, ApUnavailable, ApTimeout and ApQueueFull;
            false for LabelRejectedKey, LabelHardwareError, RenderError, InvalidCommand and InternalError.
            Central owns business retries: issue a new updateId and, for display actions, a newer version.
            Re-pending the same terminal ID only retrieves its stored outcome.
        diagnostics:
          oneOf:
            - $ref: '#/components/schemas/Diagnostics'
            - type: 'null'
      examples:
        - updateId: 7f0d0d5c-0b7e-4d2a-9c1e-1f3b6a4d8e21
          tagId: 840001282A7E
          version: 42
          action: Update
          status: Succeeded
          statusAt: '2026-09-05T14:03:41Z'
          attempt: 2
          apId: 0CNT
          failureCode: null
          failureMessage: null
          retryable: null
          diagnostics: { rfPower: -58, battery: 30, temperature: 22, statusByte: 129, lowBattery: false }

    LabelTelemetry:
      type: object
      required: [tagId, firstSeenAt, lowBattery]
      properties:
        tagId: { type: string }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        lastSeenApId: { type: [string, 'null'] }
        rfPower: { type: [integer, 'null'], description: dBm of the last sighting. }
        battery: { type: [integer, 'null'], description: 'Raw vendor byte, not a percentage; unit unconfirmed (likely tenths of a volt). A fresh cell has been observed at about 31.' }
        lowBattery: { type: boolean, description: The Pi's judgement with its configured threshold (25). }
        temperature: { type: [integer, 'null'] }
        statusByte: { type: [integer, 'null'] }
        firmwareVersion: { type: [integer, 'null'] }
        type: { type: [integer, 'null'] }
        size: { type: [integer, 'null'] }
        color: { type: [integer, 'null'] }
        factory: { type: [integer, 'null'] }
        lastSuccessApId: { type: [string, 'null'] }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
        lastResultAt: { type: [string, 'null'], format: date-time }
        lastResultSuccess: { type: [boolean, 'null'] }

    AccessPointTelemetry:
      type: object
      required: [apId, connected, stale, heartbeatIntervalSeconds, waitCount, sendCount]
      properties:
        apId: { type: string }
        connected: { type: boolean }
        stale: { type: boolean, description: Connected but no heartbeat within the configured threshold (default three intervals); treat prolonged staleness as offline. }
        connectedAt: { type: [string, 'null'], format: date-time }
        disconnectedAt: { type: [string, 'null'], format: date-time }
        lastHeartbeatAt: { type: [string, 'null'], format: date-time }
        heartbeatIntervalSeconds: { type: integer }
        apVersion: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        waitCount: { type: integer }
        sendCount: { type: integer }

    TelemetryReport:
      type: object
      required: [storeId, reportedAt, full, labels, accessPoints]
      properties:
        storeId: { type: string }
        reportedAt: { type: string, format: date-time }
        full: { type: boolean, description: true when `labels` holds every label the Pi knows. }
        labels:
          type: array
          items: { $ref: '#/components/schemas/LabelTelemetry' }
        accessPoints:
          type: array
          items: { $ref: '#/components/schemas/AccessPointTelemetry' }
